<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mini Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#f5f6fa;
    --card:#ffffff;
    --primary:#3b5bfd;
    --primary-dark:#2c46d6;
    --primary-soft:#eef1ff;
    --text:#1a1d29;
    --muted:#6b7280;
    --border:#e7e9ee;
    --success:#16a34a;
    --success-soft:#e9f9ef;
    --danger:#ef4444;
    --danger-soft:#fdeceb;
    --warn:#f59e0b;
    --warn-soft:#fef6e7;
    --radius:14px;
    --product-bg:radial-gradient(140% 140% at 30% 18%, #ffffff 0%, #f5f6fa 70%, #ececf4 100%);
    --product-shadow:inset 0 0 30px rgba(20,20,50,.035);
  }
  :root[data-theme="dark"]{
    --bg:#0f1117;
    --card:#181b26;
    --primary:#5b7cff;
    --primary-dark:#4761d9;
    --primary-soft:#1f2542;
    --text:#eef0f5;
    --muted:#8b91a5;
    --border:#282c3b;
    --success:#34d399;
    --success-soft:#0f2e22;
    --danger:#f87171;
    --danger-soft:#3a1719;
    --warn:#fbbf24;
    --warn-soft:#332608;
    --product-bg:radial-gradient(140% 140% at 30% 18%, #333a4d 0%, #1c2029 65%, #101218 100%);
    --product-shadow:inset 0 0 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  svg{display:block;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d7dae3;border-radius:8px;}

  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;white-space:nowrap;}
  .logo-badge{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#4f6df5,#3b5bfd 60%,#2c46d6);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(59,91,253,.35);flex-shrink:0;}

  #loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:500;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  header{
    height:70px;background:var(--card);border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:0 24px;
    position:sticky;top:0;z-index:50;
  }
  .search-box{flex:1;max-width:440px;margin:0 20px;position:relative;}
  .search-box input{width:100%;padding:11px 44px 11px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:.15s;}
  .search-box input:focus{border-color:var(--primary);background:var(--card);}
  .search-box .icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  .header-right{display:flex;align-items:center;gap:12px;white-space:nowrap;}
  .h-link{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);cursor:pointer;}
  .h-link svg{color:var(--muted);}
  .cart-pill{position:relative;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;padding:6px 4px;border-radius:8px;}
  .cart-pill.active{color:var(--primary);}
  .cart-pill.active svg{color:var(--primary);}
  .badge{position:absolute;top:-6px;right:-8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:1px 5px;min-width:16px;text-align:center;}
  .icon-toggle{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-toggle:hover{background:var(--bg);}
  .lang-select{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12.5px;font-weight:700;outline:none;}
  .profile{display:flex;align-items:center;gap:8px;cursor:pointer;position:relative;padding:4px 6px;border-radius:10px;}
  .profile:hover{background:var(--bg);}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .profile-meta{line-height:1.15;}
  .profile-meta .name{font-size:13px;font-weight:600;}
  .profile-meta .role{font-size:11px;color:var(--muted);}
  .dropdown{position:absolute;top:48px;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(20,20,40,.18);min-width:190px;padding:6px;display:none;z-index:80;}
  .dropdown.open{display:block;}
  .dropdown a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--text);}
  .dropdown a svg{color:var(--muted);flex-shrink:0;}
  .dropdown a:hover{background:var(--bg);}
  .dropdown a.logout{color:var(--danger);}
  .dropdown a.logout svg{color:var(--danger);}
  .dropdown a.logout:hover{background:var(--danger-soft);}
  .dropdown .divider{height:1px;background:var(--border);margin:5px 4px;}
  .login-btn-header{background:var(--primary);color:#fff;border:none;padding:9px 20px;border-radius:9px;font-size:13.5px;font-weight:700;}
  .login-btn-header:hover{background:var(--primary-dark);}

  .layout{display:flex;align-items:flex-start;}
  .sidebar{width:230px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);min-height:calc(100vh - 70px);padding:22px 14px;position:sticky;top:70px;display:flex;flex-direction:column;justify-content:space-between;}
  .side-title{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 10px 12px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:14px;color:var(--text);margin-bottom:2px;cursor:pointer;transition:.12s;}
  .nav-item svg{flex-shrink:0;color:var(--muted);}
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--primary);color:#fff;}
  .nav-item.active svg{color:#fff;}
  .side-bottom .nav-item{color:var(--muted);}
  .side-bottom .nav-item.logout:hover{background:var(--danger-soft);color:var(--danger);}
  .side-bottom .nav-item.logout:hover svg{color:var(--danger);}

  .content-row{flex:1;display:flex;align-items:flex-start;padding:24px;gap:24px;min-width:0;}
  .main-col{flex:1;min-width:0;}
  .cart-col{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:18px;}

  .btn-primary{background:var(--primary);color:#fff;border:none;padding:13px 26px;border-radius:10px;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s;}
  .btn-primary:hover{background:var(--primary-dark);}

  .period-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;transition:.15s;}
  .period-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  .banner-slide-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .banner-slide-thumb{width:60px;height:60px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--product-bg);box-shadow:var(--product-shadow);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
  .banner-slide-thumb img{width:100%;height:100%;object-fit:contain;}
  .banner-slide-info{flex:1;min-width:0;}
  .banner-slide-info .n{font-weight:700;font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .banner-slide-info .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .section-head h2{font-weight:700;}
  .see-all{color:var(--primary);font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .content-row.has-cart .grid{grid-template-columns:repeat(3,1fr);}
  .content-row.has-cart .shop-layout .grid{grid-template-columns:repeat(2,1fr);}
  @media (min-width:1500px){ .grid{grid-template-columns:repeat(5,1fr);} .content-row.has-cart .grid{grid-template-columns:repeat(4,1fr);} .content-row.has-cart .shop-layout .grid{grid-template-columns:repeat(2,1fr);} }
  .p-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;position:relative;transition:.2s;display:flex;flex-direction:column;}
  .p-card:hover{box-shadow:0 14px 30px rgba(20,20,50,.1);transform:translateY(-3px);}
  .p-badges{position:absolute;top:10px;left:10px;z-index:2;display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
  .p-badge{padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:800;color:#fff;letter-spacing:.02em;}
  .p-badge.b-sale{background:var(--danger);}
  .p-badge.b-newtag{background:var(--success);}
  .p-badge.b-best{background:var(--warn);color:#4a2e02;}
  .fav-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;z-index:2;transition:.15s;color:var(--text);}
  .fav-btn.active{color:var(--danger);border-color:#fbd0cd;}
  .p-image{height:150px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden;padding:12px;background:var(--product-bg);box-shadow:var(--product-shadow);border:1px solid var(--border);position:relative;}
  .p-image img{width:100%;height:100%;object-fit:contain;transition:transform .35s ease;}
  .p-image svg{max-height:100%;}
  .p-card:hover .p-image img{transform:scale(1.08);}
  .p-quick-actions{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,20,.28);opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .p-card:hover .p-quick-actions{opacity:1;pointer-events:auto;}
  .p-quick-actions button{width:40px;height:40px;border-radius:50%;border:none;background:var(--card);box-shadow:0 4px 14px rgba(20,20,50,.28);display:flex;align-items:center;justify-content:center;color:var(--text);transform:scale(.85);transition:.15s;}
  .p-card:hover .p-quick-actions button{transform:scale(1);}
  .p-quick-actions button:hover{background:var(--primary);color:#fff;}
  .p-cat{font-size:11.5px;color:var(--muted);margin:2px 0 4px;}
  .p-name{font-weight:700;font-size:14px;margin-bottom:4px;line-height:1.3;}
  .p-rating{display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .p-rating .stars{display:inline-flex;gap:1px;color:#f5a623;}
  .p-rating-count{font-size:11px;color:var(--muted);}
  .p-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .p-price{font-weight:800;font-size:16px;}
  .p-price-old{font-size:12.5px;color:var(--muted);text-decoration:line-through;}
  .btn-cart{width:100%;background:var(--primary);color:#fff;border:none;padding:10px;border-radius:9px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;}
  .btn-cart:hover{background:var(--primary-dark);}
  .out-of-stock{opacity:.55;}
  .stock-tag{font-size:11px;color:var(--danger);font-weight:700;margin-bottom:8px;}

  .features{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px;}
  .feature{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;}
  .feature .ic{width:26px;height:26px;margin:0 auto 10px;color:var(--primary);}
  .feature .t{font-weight:700;font-size:13.5px;margin-bottom:3px;}
  .feature .d{font-size:12px;color:var(--muted);}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .panel-head h3{font-size:16px;margin:0;font-weight:700;}
  .panel-head .count{font-size:12.5px;color:var(--muted);}
  .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .cart-item:last-child{border-bottom:none;}
  .cart-thumb{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;padding:5px;background:var(--product-bg);box-shadow:var(--product-shadow);border:1px solid var(--border);}
  .cart-thumb img{width:100%;height:100%;object-fit:contain;}
  .cart-info{flex:1;min-width:0;}
  .cart-info .n{font-size:13.5px;font-weight:600;margin-bottom:2px;}
  .cart-info .p{font-size:13.5px;font-weight:700;margin-bottom:8px;}
  .qty-row{display:flex;align-items:center;gap:8px;}
  .qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .qty-btn:hover{background:var(--bg);}
  .qty-val{font-size:13px;font-weight:600;min-width:14px;text-align:center;}
  .trash-btn{margin-left:auto;color:var(--muted);background:none;border:none;display:flex;}
  .trash-btn:hover{color:var(--danger);}
  .promo-row{display:flex;gap:8px;margin:14px 0;}
  .promo-row input{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none;}
  .promo-row input:focus{border-color:var(--primary);}
  .btn-outline{background:var(--primary-soft);color:var(--primary);border:none;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;white-space:nowrap;}
  .btn-outline:hover{background:var(--primary);color:#fff;}
  .sum-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:8px;}
  .sum-row.total{color:var(--text);font-weight:800;font-size:17px;border-top:1px solid var(--border);padding-top:12px;margin-top:6px;}
  .sum-row .green{color:var(--success);font-weight:600;}
  .checkout-btn{width:100%;background:var(--primary);color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700;font-size:14.5px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .checkout-btn:hover{background:var(--primary-dark);}
  .why-list{list-style:none;padding:0;margin:0;}
  .why-list li{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--border);}
  .why-list li:last-child{border-bottom:none;}
  .why-list .chk{color:var(--primary);display:flex;flex-shrink:0;}

  .toolbar{display:flex;gap:12px;margin-bottom:18px;align-items:center;}
  .toolbar input, .toolbar select{padding:10px 14px;border-radius:9px;border:1px solid var(--border);font-size:13.5px;outline:none;background:var(--card);color:var(--text);}
  .toolbar input:focus, .toolbar select:focus{border-color:var(--primary);}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border);}
  th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg);}
  td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .row-thumb{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;background:var(--product-bg);box-shadow:var(--product-shadow);border:1px solid var(--border);}
  .row-thumb img{width:100%;height:100%;object-fit:contain;}
  .badge-tag{padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .b-green{background:var(--success-soft);color:var(--success);}
  .b-red{background:var(--danger-soft);color:var(--danger);}
  .b-yellow{background:var(--warn-soft);color:#b45309;}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--card);display:inline-flex;align-items:center;justify-content:center;margin-right:6px;color:var(--text);}
  .icon-btn:hover{background:var(--bg);}
  .icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:#fbd0cd;}

  .stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;}
  .stat-card .lbl{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .stat-card .val{font-size:24px;font-weight:800;}
  .stat-card .delta{font-size:12px;color:var(--success);font-weight:600;margin-top:6px;}
  .bars{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;}
  .bar-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .bar-label{width:110px;font-size:13px;color:var(--muted);flex-shrink:0;}
  .bar-track{flex:1;background:var(--bg);border-radius:8px;height:14px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),#7c93ff);border-radius:8px;}
  .bar-val{width:70px;text-align:right;font-size:13px;font-weight:700;flex-shrink:0;}

  .form-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:640px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
  .field input, .field select, .field textarea{width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--border);font-size:14px;outline:none;background:var(--card);color:var(--text);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
  .field-row{display:flex;gap:16px;}
  .field-row .field{flex:1;}
  .emoji-pick{display:flex;gap:8px;flex-wrap:wrap;}
  .emoji-opt{width:44px;height:44px;border-radius:10px;border:2px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;padding:6px;}
  .emoji-opt.sel{border-color:var(--primary);background:var(--primary-soft);}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
  .switch-row:last-child{border-bottom:none;}
  .switch{width:42px;height:24px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:.15s;}
  .switch.on{background:var(--primary);}
  .switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s;}
  .switch.on .knob{left:20px;}
  .photo-upload{display:flex;align-items:center;gap:14px;}
  .photo-preview{width:96px;height:96px;border-radius:12px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:var(--product-bg);box-shadow:var(--product-shadow);padding:8px;color:var(--muted);}
  .photo-preview img{width:100%;height:100%;object-fit:contain;}
  .banner-photo-preview{width:100%;max-width:330px;aspect-ratio:1320/373;border-radius:12px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:var(--product-bg);box-shadow:var(--product-shadow);color:var(--muted);}
  .banner-photo-preview img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
  .banner-res-hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .banner-res-warn{font-size:11.5px;color:var(--warn);margin-top:6px;display:flex;align-items:center;gap:5px;}
  .upload-btn{background:var(--primary-soft);color:var(--primary);border:none;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;}
  .upload-btn:hover{background:var(--primary);color:#fff;}
  .file-hidden{display:none;}

  .detail-wrap{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;}
  .detail-image{flex:1;min-width:280px;max-width:420px;height:380px;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px;background:var(--product-bg);box-shadow:var(--product-shadow);border:1px solid var(--border);}
  .detail-image img{width:100%;height:100%;object-fit:contain;}
  .detail-image svg{max-height:100%;}
  .detail-info{flex:1;min-width:280px;}
  .detail-title{font-size:26px;font-weight:800;margin:2px 0 8px;}
  .detail-price{font-size:24px;font-weight:800;margin-bottom:6px;}
  .detail-desc{color:var(--muted);line-height:1.65;font-size:14px;margin-bottom:20px;}
  .detail-actions{display:flex;gap:10px;}
  .specs-table{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:10px;}
  .spec-row{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px;}
  .spec-row:last-child{border-bottom:none;}
  .spec-k{color:var(--muted);}
  .spec-v{font-weight:600;text-align:right;}
  .in-stock-line{display:flex;align-items:center;gap:6px;color:var(--success);font-size:13px;font-weight:700;margin-bottom:16px;}

  .overlay{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .modal{position:relative;background:var(--card);border-radius:16px;padding:24px;width:360px;max-width:100%;max-height:88vh;overflow-y:auto;}
  .modal-close-btn{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;z-index:5;}
  .modal-close-btn:hover{background:var(--bg);}
  .modal h3{margin:0 0 10px;font-size:16.5px;}
  .modal p{margin:0 0 18px;color:var(--muted);font-size:13.5px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
  .btn-ghost{background:var(--bg);color:var(--text);border:none;padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:600;}
  .btn-danger{background:var(--danger);color:#fff;border:none;padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:600;}
  .toast-wrap{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;}
  .toast{background:#1a1d29;color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 25px rgba(0,0,0,.2);animation:slidein .2s ease-out;}
  @keyframes slidein{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .ic{width:38px;height:38px;margin:0 auto 12px;color:var(--muted);}

  .auth-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;}
  .auth-tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:16px;}
  .auth-tab{flex:1;text-align:center;padding:8px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;}
  .auth-tab.active{background:var(--card);color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .auth-error{background:var(--danger-soft);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;}
  .auth-error.show{display:block;}
  .auth-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5;}
  .btn-block{width:100%;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:9px;font-size:14px;font-weight:700;}
  .btn-block:hover{background:var(--primary-dark);}

  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .cat-tile{background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:.12s;}
  .cat-tile:hover{border-color:var(--primary);}
  .cat-tile.active{background:var(--primary-soft);border-color:var(--primary);}
  .cat-tile-ic{width:26px;height:26px;margin:0 auto 8px;color:var(--text);}
  .cat-tile.active .cat-tile-ic{color:var(--primary);}
  .cat-tile-name{font-size:12.5px;font-weight:700;margin-bottom:2px;}
  .cat-tile-count{font-size:11px;color:var(--muted);}
  .cat-tile.active .cat-tile-name{color:var(--primary);}

  .illus-pick{display:flex;gap:8px;flex-wrap:wrap;}
  .illus-opt{width:52px;height:52px;border-radius:10px;border:2px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;padding:8px;}
  .illus-opt.sel{border-color:var(--primary);background:var(--primary-soft);}

  /* ---- shop / filters layout ---- */
  .shop-layout{display:flex;align-items:flex-start;gap:22px;}
  .filters-panel{width:250px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;position:sticky;top:94px;}
  .filters-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .filters-head h3{margin:0;font-size:15px;}
  .clear-filters{font-size:12px;color:var(--primary);cursor:pointer;font-weight:600;}
  .filter-block{padding:14px 0;border-bottom:1px solid var(--border);}
  .filter-block:last-child{border-bottom:none;padding-bottom:0;}
  .filter-block-title{font-size:12.5px;font-weight:700;margin-bottom:10px;}
  .filter-search{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12.5px;outline:none;margin-bottom:10px;}
  .brand-list{display:flex;flex-direction:column;gap:8px;max-height:170px;overflow-y:auto;}
  .brand-item{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;}
  .filter-empty{font-size:12px;color:var(--muted);}
  .price-range-row{display:flex;align-items:center;gap:8px;}
  .price-range-row input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12.5px;outline:none;}
  .price-range-row span{color:var(--muted);}
  .filter-toggle-row{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;padding:6px 0;}
  .rating-filter-list{display:flex;flex-direction:column;gap:8px;}
  .rating-filter-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;padding:5px 7px;border-radius:8px;}
  .rating-filter-item:hover{background:var(--bg);}
  .rating-filter-item.active{background:var(--primary-soft);color:var(--primary);}
  .rating-filter-item .stars{color:#f5a623;display:inline-flex;gap:1px;}

  .products-main{flex:1;min-width:0;}
  .toolbar2{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .filters-toggle-btn{display:none;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;}
  .results-count{font-size:13px;color:var(--muted);}
  .results-count b{color:var(--text);}
  .sort-select{margin-left:auto;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none;}

  /* ---- hero banner slider ---- */
  .hero-slider{position:relative;border-radius:16px;overflow:hidden;margin:0 auto 22px;width:94%;max-width:1320px;aspect-ratio:1320/373;background:var(--primary-soft);box-shadow:0 6px 20px rgba(20,20,50,.08);}
  .hero-slide-img-wrap{position:relative;width:100%;height:100%;}
  .hero-slide-img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;animation:heroFade .5s ease;}
  @keyframes heroFade{from{opacity:0;}to{opacity:1;}}
  .hero-slide-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,var(--primary-soft),var(--bg));color:var(--muted);}
  .hero-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.85);color:#111;display:flex;align-items:center;justify-content:center;z-index:3;}
  .hero-arrow:hover{background:#fff;}
  .hero-arrow.prev{left:16px;}
  .hero-arrow.next{right:16px;}
  .hero-dots{position:absolute;bottom:16px;right:20px;display:flex;gap:6px;z-index:3;}
  .hero-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;transition:.2s;border:none;padding:0;}
  .hero-dot.active{background:#fff;width:22px;border-radius:5px;}
  @media (max-width:520px){
    .hero-slider{border-radius:12px;width:96%;margin-bottom:16px;}
    .hero-arrow{width:26px;height:26px;}
    .hero-dots{bottom:8px;right:10px;}
    .hero-dot{width:6px;height:6px;}
    .hero-dot.active{width:16px;}
  }

  /* ---- product detail gallery ---- */
  .detail-gallery{flex:1;min-width:280px;max-width:420px;}
  .detail-gallery .detail-image{max-width:100%;}
  .gallery-thumbs{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap;}
  .gallery-thumb{width:60px;height:60px;border-radius:10px;overflow:hidden;padding:6px;background:var(--product-bg);border:2px solid var(--border);cursor:pointer;box-shadow:var(--product-shadow);}
  .gallery-thumb img{width:100%;height:100%;object-fit:contain;}
  .gallery-thumb.active{border-color:var(--primary);}
  .lightbox-wrap{display:flex;align-items:center;justify-content:center;}
  .lightbox-wrap img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:12px;}

  /* ---- multi-photo manager (admin) ---- */
  .photo-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .photo-thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--product-bg);border:1px solid var(--border);}
  .photo-thumb img{width:100%;height:100%;object-fit:contain;}
  .photo-thumb.is-main{border-color:var(--primary);}
  .main-tag{position:absolute;top:3px;left:3px;background:var(--primary);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:5px;}
  .photo-thumb-actions{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;background:rgba(0,0,0,.55);padding:3px;opacity:0;transition:.15s;}
  .photo-thumb:hover .photo-thumb-actions{opacity:1;}
  .photo-thumb-actions button{width:20px;height:20px;border:none;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;}
  .photo-thumb-actions button:hover{color:var(--primary);}
  .photo-add-tile{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex-shrink:0;}
  .photo-add-tile:hover{border-color:var(--primary);color:var(--primary);}

  /* ---- quick view modal ---- */
  .quickview{display:flex;gap:20px;flex-wrap:wrap;}
  .quickview-image{width:200px;height:200px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px;background:var(--product-bg);box-shadow:var(--product-shadow);border:1px solid var(--border);}
  .quickview-image img{width:100%;height:100%;object-fit:contain;}
  .quickview-info{flex:1;min-width:200px;}

  .cart-overlay-backdrop{display:none;}
  .cart-col-close{display:none;}
  .menu-toggle-btn{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;flex-shrink:0;}
  .mobile-menu-backdrop{display:none;}
  .sidebar-close-btn{display:none;}
  .filters-backdrop{display:none;}
  .filters-close-btn{display:none;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  @media (max-width:1300px){
    .grid{grid-template-columns:repeat(4,1fr);}
  }
  @media (max-width:700px){
    .cart-overlay-backdrop{display:block;position:fixed;inset:0;background:rgba(15,15,28,.5);z-index:199;animation:heroFade .18s ease;}
    .cart-col{display:flex;flex-direction:column;position:fixed;top:0;right:0;width:min(380px,92vw);height:100vh;height:100dvh;max-width:none;z-index:200;background:var(--bg);box-shadow:-14px 0 34px rgba(0,0,0,.22);border-radius:0;margin:0;padding:16px;overflow-y:auto;}
    .cart-col-close{display:flex;align-self:flex-end;position:sticky;top:0;width:34px;height:34px;border-radius:50%;border:none;background:var(--card);box-shadow:0 4px 14px rgba(20,20,50,.18);color:var(--text);align-items:center;justify-content:center;cursor:pointer;margin-bottom:6px;flex-shrink:0;}
  }
  body.cart-drawer-lock{overflow:hidden;}
  @media (max-width:1100px){
    .stat-cards{grid-template-columns:repeat(2,1fr);}
    .features{grid-template-columns:repeat(2,1fr);}
    .filters-panel{width:220px;}
  }
  @media (max-width:980px){
    .grid{grid-template-columns:repeat(3,1fr);}
    .content-row.has-cart .grid{grid-template-columns:repeat(3,1fr);}
    .sidebar{width:76px;padding:22px 8px;}
    .sidebar .side-title, .nav-item span, .nav-item{font-size:0;}
    .sidebar .side-title{display:none;}
    .nav-item{justify-content:center;padding:11px;gap:0;}
    .nav-item svg{margin:0;}
  }
  @media (max-width:820px){
    .shop-layout{flex-direction:column;}
    .filters-panel{display:none;position:fixed;inset:0;z-index:120;width:100%;height:100%;overflow-y:auto;border-radius:0;padding:20px;}
    .filters-panel.open{display:block;}
    .filters-toggle-btn{display:inline-flex;}
    .detail-wrap{gap:20px;}
    .filters-backdrop.open{display:block;position:fixed;inset:0;background:rgba(15,15,28,.5);z-index:119;}
    .filters-close-btn{display:flex;align-self:flex-end;position:sticky;top:0;width:34px;height:34px;border-radius:50%;border:none;background:var(--card);box-shadow:0 4px 14px rgba(20,20,50,.18);color:var(--text);align-items:center;justify-content:center;cursor:pointer;margin-bottom:6px;flex-shrink:0;}
  }
  body.filters-drawer-lock{overflow:hidden;}
  @media (max-width:700px){
    .menu-toggle-btn{display:inline-flex;}
    .sidebar{display:flex !important;position:fixed;top:0;left:0;height:100vh;height:100dvh;width:78%;max-width:290px;transform:translateX(-105%);transition:transform .25s ease;z-index:210;box-shadow:14px 0 34px rgba(0,0,0,.25);border-radius:0;padding:16px;flex-direction:column;justify-content:space-between;}
    .sidebar.open{transform:translateX(0);}
    .sidebar .side-title{display:block !important;font-size:12px !important;}
    .nav-item{font-size:14px !important;justify-content:flex-start !important;padding:11px 12px !important;gap:11px !important;}
    .nav-item span{font-size:14px !important;}
    .mobile-menu-backdrop.open{display:block;position:fixed;inset:0;background:rgba(15,15,28,.5);z-index:209;}
    .sidebar-close-btn{display:flex;align-self:flex-end;width:30px;height:30px;border-radius:50%;border:none;background:var(--bg);color:var(--text);align-items:center;justify-content:center;margin-bottom:10px;cursor:pointer;flex-shrink:0;}
    body.menu-drawer-lock{overflow:hidden;}
    .logo{font-size:15px;}
    .logo-badge{width:30px;height:30px;}
    header{gap:8px;}
    .grid{grid-template-columns:repeat(2,1fr);}
    .content-row.has-cart .grid{grid-template-columns:repeat(2,1fr);}
    .cat-grid{grid-template-columns:repeat(2,1fr);}
    .content-row{padding:16px;}
    header{height:auto;flex-wrap:wrap;padding:12px 14px;}
    .search-box{order:3;max-width:100%;margin:0;flex-basis:100%;}
    .header-right{gap:8px;}
    .h-link span, .h-link{font-size:0;gap:0;}
    .h-link svg{font-size:initial;}
    .profile-meta{display:none;}
    .stat-cards, .features{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .content-row.has-cart .grid{grid-template-columns:repeat(2,1fr);}
    .p-card{padding:8px;}
    .p-image{height:110px;}
    .cart-pill span:not(.badge){font-size:0;}
    .toolbar2{gap:8px;}
    .results-count{order:3;flex-basis:100%;}
  }
</style>
</head>

function categoryIcon(cat){
  const map = {'Смартфоны':'phone','Наушники':'earbuds','Ноутбуки':'laptop','Часы':'watch','Планшеты':'tablet','Колонки':'speaker'};

/* =========================================================
   STORAGE — Claude's persistent storage when running inside a
   Claude.ai artifact; falls back to the browser's own
   localStorage when opened as a standalone file.
========================================================= */
const K_CATALOG = 'shop-catalog';
const K_ACCOUNTS = 'shop-accounts';
const K_CARTFAV = 'shop-cart-fav';
const K_SESSION = 'shop-session';
const K_PREFS = 'shop-prefs';
const K_BANNERS = 'shop-banners';

function hasClaudeStorage(){ return (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function'); }
async function storGet(key){
  try{
    if(hasClaudeStorage()){ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function storSet(key, value){
  try{
    if(hasClaudeStorage()){ await window.storage.set(key, JSON.stringify(value), false); }
    else { window.localStorage.setItem(key, JSON.stringify(value)); }
  }catch(e){ console.error('storage save failed', key, e); }
}

const BANNER_MIN_W = 1320;
const BANNER_MIN_H = 460;
const BANNER_IDEAL_W = 1920;
const BANNER_IDEAL_H = 620;
const BANNER_TARGET_RATIO = BANNER_MIN_W / BANNER_MIN_H;
function getImageDimensions(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => resolve({ w: img.width, h: img.height });
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function checkBannerImage(dims){
  const tooSmall = dims.w < BANNER_MIN_W || dims.h < BANNER_MIN_H;
  const ratio = dims.w / dims.h;
  const ratioDiff = Math.abs(ratio - BANNER_TARGET_RATIO) / BANNER_TARGET_RATIO;
  const badRatio = !tooSmall && ratioDiff > 0.22;
  return { tooSmall, badRatio };
}

/* =========================================================
   INIT / LOAD / SAVE
========================================================= */
async function init(){
  const catalog = await storGet(K_CATALOG);
  if(catalog){
    products = catalog.products || defaultProducts();
    orders = catalog.orders || defaultOrders();
    settings = catalog.settings || defaultSettings();
    nextId = catalog.nextId || 100;
    nextOrderId = catalog.nextOrderId || 2000;
  } else {
    products = defaultProducts(); orders = defaultOrders(); settings = defaultSettings();
    nextId = seedNextId(); nextOrderId = 2000;
    await saveCatalog();
  }

  const acc = await storGet(K_ACCOUNTS);
  if(acc && acc.users && acc.users.length){ accounts = acc.users; }
  else { accounts = defaultAccounts(); await saveAccounts(); }

  const cf = await storGet(K_CARTFAV);
  if(cf){ cart = cf.cart || {}; favorites = new Set(cf.favorites || []); }
  else { cart = {}; favorites = new Set(); }

  const bn = await storGet(K_BANNERS);
  if(bn && Array.isArray(bn.slides)){
    banners = bn.slides;
    nextBannerId = bn.nextId || (banners.length ? Math.max(...banners.map(s=>s.id))+1 : 1);
  } else {
    banners = defaultBanners();
    nextBannerId = seedNextBannerId();
    await saveBanners();
  }

  // Safety net: purge legacy demo orders that used to ship with the template
  const seedIds = ['#1038','#1039','#1040','#1041','#1042'];
  if(orders.some(o=>seedIds.includes(o.id))){
    orders = orders.filter(o=>!seedIds.includes(o.id));
    await saveCatalog();
  }

  const sess = await storGet(K_SESSION);
  session = sess && sess.userId ? sess : null;

  const prefs = await storGet(K_PREFS);
  if(prefs){ theme = prefs.theme || 'light'; lang = prefs.lang || 'ru'; showCartPanel = typeof prefs.cartOpen === 'boolean' ? prefs.cartOpen : true; }
  applyTheme();
  applyShopName();

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && showCartPanel && window.matchMedia('(max-width:700px)').matches){ toggleCartPanel(); }
    if(e.key === 'Escape' && mobileMenuOpen){ closeMobileMenu(); }
    if(e.key === 'Escape' && mobileFiltersOpen){ toggleMobileFilters(); }
  });
  renderRoot();
}
function saveCatalog(){ return storSet(K_CATALOG, {products, orders, settings, nextId, nextOrderId}); }
function saveAccounts(){ return storSet(K_ACCOUNTS, {users: accounts}); }
function saveCartFav(){ return storSet(K_CARTFAV, {cart, favorites: Array.from(favorites)}); }
function saveBanners(){ return storSet(K_BANNERS, {slides: banners, nextId: nextBannerId}); }
function saveSession(){ return storSet(K_SESSION, session || {userId:null}); }
function savePrefs(){ return storSet(K_PREFS, {theme, lang, cartOpen: showCartPanel}); }

const CURRENCY_RATES = { USD:1, EUR:0.92, RUB:80, AZN:1.7 };
const CURRENCY_SYMBOLS = { USD:'$', EUR:'€', RUB:'₽', AZN:'₼' };
function fmt(n){
  const cur = settings.currency || 'USD';
  const rate = CURRENCY_RATES[cur] || 1;
  const symbol = CURRENCY_SYMBOLS[cur] || '$';
  const val = Number(n) * rate;
  const decimals = (cur==='RUB' || cur==='AZN') ? 0 : 2;
  const rounded = Math.round(val * Math.pow(10,decimals)) / Math.pow(10,decimals);
  const str = rounded.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:decimals});
  return (cur==='USD' || cur==='EUR') ? symbol + str : str + ' ' + symbol;
}
// Product prices are always stored internally in USD (base currency).
// These helpers convert to/from the currently selected display currency
// so admin edit fields show and accept values in that currency.
function toDisplayCurrency(usd){
  const cur = settings.currency || 'USD';
  const rate = CURRENCY_RATES[cur] || 1;
  const decimals = (cur==='RUB' || cur==='AZN') ? 0 : 2;
  const val = Number(usd||0) * rate;
  return Math.round(val * Math.pow(10,decimals)) / Math.pow(10,decimals);
}
function fromDisplayCurrency(val){
  const cur = settings.currency || 'USD';
  const rate = CURRENCY_RATES[cur] || 1;
  return Number(val||0) / rate;
}
function currencySymbol(){ return CURRENCY_SYMBOLS[settings.currency] || '$'; }
function showToast(msg){
  const wrap = document.getElementById('toastWrap');

  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); }, 2200);
}

function doLogin(){
  const email = document.getElementById('li_email').value.trim().toLowerCase();
  const pass = document.getElementById('li_pass').value;
  if(!email || !pass){ setAuthError(t('enterEmailPass')); return; }
  const acc = accounts.find(a=>a.email.toLowerCase()===email);
  if(!acc || acc.password !== pass){ setAuthError(t('wrongCredentials')); return; }
  session = {userId: acc.id};
  saveSession();
  closeModal();
  showToast(`${t('welcomePrefix')} ${acc.name}!`);
  renderRoot();
}
function doRegister(){
  const name = document.getElementById('rg_name').value.trim();
  const email = document.getElementById('rg_email').value.trim().toLowerCase();
  const pass = document.getElementById('rg_pass').value;
  const pass2 = document.getElementById('rg_pass2').value;
  if(!name || !email || !pass){ setAuthError(t('fillAllFields')); return; }
  if(pass.length < 4){ setAuthError(t('passwordTooShort')); return; }
  if(pass !== pass2){ setAuthError(t('passwordsMismatch')); return; }
  if(accounts.some(a=>a.email.toLowerCase()===email)){ setAuthError(t('emailTaken')); return; }
  const acc = { id:(accounts.reduce((m,a)=>Math.max(m,a.id),0)+1), name, email, password:pass, role:'Покупатель', joined:new Date().toLocaleDateString('ru-RU') };
  accounts.push(acc);
  saveAccounts();
  session = {userId: acc.id};
  saveSession();
  closeModal();
  showToast(`${t('accountCreatedPrefix')} ${name}!`);
  renderRoot();
}
function doForgotPassword(){
  const email = document.getElementById('fp_email').value.trim().toLowerCase();
  if(!email){ setAuthError(t('enterEmailPass')); return; }
  const acc = accounts.find(a=>a.email.toLowerCase()===email);
  if(!acc){ setAuthError(t('emailNotFound')); return; }
  forgotEmail = acc.email;
  authTab = 'reset';
  authError = '';
  const box = document.getElementById('authModalBox');
  if(box) box.innerHTML = authModalInner();
  showToast(t('resetLinkSentToast'));
}
function doResetPassword(){
  const p1 = document.getElementById('rp_pass').value;
  const p2 = document.getElementById('rp_pass2').value;
  if(!p1 || !p2){ setAuthError(t('fillAllFields')); return; }
  if(p1.length < 4){ setAuthError(t('passwordTooShort')); return; }
  if(p1 !== p2){ setAuthError(t('passwordsMismatch')); return; }
  const acc = accounts.find(a=>a.email===forgotEmail);
  if(acc){ acc.password = p1; saveAccounts(); }
  authTab = 'login';
  forgotEmail = '';
  closeModal();
  showToast(t('passwordResetSuccess'));
}

========================================================= */
function addToCart(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const outOfStock = typeof p.stock === 'number' && p.stock <= 0;
  if(outOfStock) return;
  cart[id] = (cart[id]||0) + 1;
  saveCartFav();
  showToast(`${p.name} ${t('addedToCartPrefix')}`);
  renderApp();
}
function changeQty(id, delta){
  if(!cart[id]) return;
  cart[id] += delta;
  if(cart[id]<=0) delete cart[id];
  saveCartFav();
  renderApp();
}
function removeFromCart(id){ delete cart[id]; saveCartFav(); renderApp(); }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartSubtotal(){ return Object.entries(cart).reduce((sum,[id,qty])=>{ const p = products.find(x=>x.id==id); return sum + (p ? p.price*qty : 0); },0); }
function applyPromo(){
  const input = document.getElementById('promoInput');
  const code = input.value.trim().toUpperCase();
  if(!code){ showToast(t('promoEmptyToast')); return; }
  const table = { 'SALE10':10, 'SALE20':20, 'MINISHOP':15 };
  if(table[code]){ promo = {code, percent:table[code]}; showToast(`${t('promoAppliedPrefix')} «${code}» ${t('promoAppliedSuffix')} -${table[code]}%`); }
  else { promo = null; showToast(t('promoInvalid')); }
  renderApp();
}
function cartTotals(){
  const subtotal = cartSubtotal();
  const shipping = 0;
  const discount = promo ? Math.round(subtotal * promo.percent/100) : 0;
  return {subtotal, shipping, discount, total: subtotal + shipping - discount};
}

    showToast(t('cartEmptyToast'));

/* =========================================================
   IMAGE UPLOAD
========================================================= */
function compressImage(file, maxDim, quality, format){
  format = format || 'image/png';
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        // Never upscale beyond the image's own resolution — only shrink
        // if it's actually larger than maxDim in its longest dimension.
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        // Note: toDataURL's quality argument is only honored for lossy
        // formats like image/jpeg or image/webp — it is ignored for
        // image/png, which always encodes losslessly.
        resolve(canvas.toDataURL(format, quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function openModal(html, width){
  const ov = document.createElement('div');
  ov.className='overlay'; ov.id='modalOverlay';
  ov.innerHTML = `<div class="modal" style="${width?`width:${width}px;`:''}">${html}</div>`;
  ov.addEventListener('click', e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
  document.addEventListener('keydown', handleModalEscKey);
}
function handleModalEscKey(e){ if(e.key === 'Escape') closeModal(); }
function closeModal(){
  const ov=document.getElementById('modalOverlay');
  if(ov) ov.remove();
  document.removeEventListener('keydown', handleModalEscKey);
}

function renderMain(){
  const row = document.getElementById('contentRow');
  if(!row) return;
  const admin = isAdmin();
  const showCartCol = (page==='home' || page==='products' || page==='favorites' || page==='productDetail') && showCartPanel;
  let mainHtml = '';
  if(page==='home') mainHtml = homePage();
  else if(page==='products') mainHtml = productsPage();
  else if(page==='productDetail') mainHtml = productDetailPage();
  else if(page==='addproduct' && admin) mainHtml = addProductPage();
  else if(page==='banner' && admin) mainHtml = bannerPage();
  else if(page==='orders' && admin) mainHtml = ordersPage();
  else if(page==='users' && admin) mainHtml = usersPage();
  else if(page==='stats' && admin) mainHtml = statsPage();
  else if(page==='settings' && admin) mainHtml = settingsPage();
  else if(page==='favorites') mainHtml = favoritesPage();
  else mainHtml = homePage();

  row.innerHTML = `
    <div class="main-col">${mainHtml}</div>
    ${showCartCol ? `<div class="cart-overlay-backdrop" onclick="toggleCartPanel()"></div><div class="cart-col"><button class="cart-col-close" onclick="toggleCartPanel()" aria-label="close">${icon('close',18)}</button>${cartPanel()}${whyPanel()}</div>` : ''}
  `;
  row.classList.toggle('has-cart', showCartCol);
  const isDrawerMode = window.matchMedia('(max-width:700px)').matches;
  document.body.classList.toggle('cart-drawer-lock', showCartCol && isDrawerMode);
  const isFiltersDrawerMode = window.matchMedia('(max-width:820px)').matches;
  document.body.classList.toggle('filters-drawer-lock', page==='products' && mobileFiltersOpen && isFiltersDrawerMode);
  restartBannerRotation();
}

function discountPct(p){
  if(!p.oldPrice || p.oldPrice<=p.price) return 0;
  return (p.oldPrice - p.price) / p.oldPrice;
}
function starsHtml(rating){
  const full = Math.round(rating||0);
  let s = '<span class="stars">';
  for(let i=1;i<=5;i++) s += i<=full ? icon('starFilled',12) : icon('starOutline',12);
  s += '</span>';
  return s;
}
function sortProducts(list, by){
  const arr = list.slice();
  if(by==='newest') arr.sort((a,b)=>b.id-a.id);
  else if(by==='priceAsc') arr.sort((a,b)=>a.price-b.price);
  else if(by==='priceDesc') arr.sort((a,b)=>b.price-a.price);
  return arr;
}

function heroInnerHtml(){
  if(!banners.length) return '';
  const s = banners[bannerIndex % banners.length];
  const photo = s.photo;
  const link = s.link || '';
  const safeLink = link.replace(/'/g, "%27");
  return `
    <div class="hero-slide-img-wrap" ${link ? `onclick="window.open('${safeLink}','_blank')" style="cursor:pointer;"` : ''}>
      ${photo ? `<img class="hero-slide-img" src="${photo}" alt="banner">` : `<div class="hero-slide-fallback">${icon('image',48)}</div>`}
    </div>
    ${banners.length>1 ? `
    <button class="hero-arrow prev" onclick="event.stopPropagation();bannerPrev()" aria-label="prev">${icon('chevLeft',22)}</button>
    <button class="hero-arrow next" onclick="event.stopPropagation();bannerNext()" aria-label="next">${icon('chevRight',22)}</button>
    <div class="hero-dots">${banners.map((_,i)=>`<button class="hero-dot ${i===bannerIndex?'active':''}" onclick="event.stopPropagation();gotoBannerSlide(${i})" aria-label="slide ${i+1}"></button>`).join('')}</div>
    ` : ''}
  `;
}
function updateHeroDom(){
  const el = document.getElementById('heroBanner');
  if(el) el.innerHTML = heroInnerHtml();
}
function gotoBannerSlide(i){
  bannerIndex = i;
  updateHeroDom();
  restartBannerRotation();
}
function bannerPrev(){
  if(!banners.length) return;
  bannerIndex = (bannerIndex - 1 + banners.length) % banners.length;
  updateHeroDom();
  restartBannerRotation();
}
function bannerNext(){
  if(!banners.length) return;
  bannerIndex = (bannerIndex + 1) % banners.length;
  updateHeroDom();
  restartBannerRotation();
}
function pauseBannerRotation(){
  if(bannerTimer){ clearInterval(bannerTimer); bannerTimer = null; }
}
function restartBannerRotation(){
  if(bannerTimer){ clearInterval(bannerTimer); bannerTimer = null; }
  if(page === 'home' && banners.length > 1){
    const secs = Math.max(1, parseInt(settings.bannerInterval) || 5);
    bannerTimer = setInterval(()=>{
      bannerIndex = (bannerIndex + 1) % banners.length;
      updateHeroDom();
    }, secs * 1000);
  }
}

      <button class="icon-btn danger" onclick="deleteBannerSlide(${s.id})" title="${t('deleteBtn')}">${icon('trash',15)}</button>

}
async function handleBannerPhoto(inputEl){
  const file = inputEl.files[0];
  inputEl.value = '';
  if(!file) return;
  try{
    const dims = await getImageDimensions(file);
    const check = checkBannerImage(dims);
    bannerDraft.photo = await compressImage(file, 2600, 0.96, 'image/jpeg');
    bannerDraft.lowRes = check.tooSmall;
    bannerDraft.badRatio = check.badRatio;
    if(check.tooSmall) showToast(t('bannerLowResWarning'));
    else if(check.badRatio) showToast(t('bannerRatioWarning'));
    renderApp();
  }
  catch(e){ showToast('Error'); }
}
function startBannerEdit(id){
  const s = banners.find(x=>x.id===id);
  if(!s) return;
  editingBannerId = id;
  bannerDraft = { photo:s.photo, link:s.link||'', lowRes:false, badRatio:false };
  renderApp();
}
function cancelBannerEdit(){
  editingBannerId = null;

}
function submitBannerSlide(){
  if(!bannerDraft.photo){ showToast(t('fillRequiredFields')); return; }
  const link = (bannerDraft.link||'').trim();
  if(editingBannerId){
    const s = banners.find(x=>x.id===editingBannerId);
    if(s){ s.photo=bannerDraft.photo; s.link=link; }
    showToast(t('slideUpdated'));
  } else {
    banners.push({ id: nextBannerId++, photo: bannerDraft.photo, link });
    showToast(t('slideAdded'));
  }
  saveBanners();
  editingBannerId = null;
  bannerDraft = emptyBannerDraft();
  bannerIndex = 0;
  renderApp();
}

function startOfWeek(d){
  const day = d.getDay();
  const diff = (day===0 ? 6 : day-1);
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()-diff);
  s.setHours(0,0,0,0);
  return s;
}
function startOfMonth(d){
  const s = new Date(d.getFullYear(), d.getMonth(), 1);
  s.setHours(0,0,0,0);
  return s;
}
function ordersInPeriod(period){
  if(period === 'all') return orders;
  const now = new Date();
  if(period === 'today'){
    const d = new Date(); d.setHours(0,0,0,0);
    return orders.filter(o => typeof o.ts === 'number' && o.ts >= d.getTime());
  }
  if(period === 'week'){
    const s = startOfWeek(now);
    return orders.filter(o => typeof o.ts === 'number' && o.ts >= s.getTime());
  }
  if(period === 'month'){
    const s = startOfMonth(now);
    return orders.filter(o => typeof o.ts === 'number' && o.ts >= s.getTime());
  }
  if(period === 'custom'){
    if(!statsCustomFrom || !statsCustomTo) return [];
    const from = new Date(statsCustomFrom + 'T00:00:00');
    const to = new Date(statsCustomTo + 'T23:59:59');
    return orders.filter(o => typeof o.ts === 'number' && o.ts >= from.getTime() && o.ts <= to.getTime());
  }
  return orders;
}
function setStatsPeriod(p){ statsPeriod = p; renderApp(); }
function applyStatsCustomRange(){

}

/* =========================================================
   IMPORT / EXPORT (admin only)
========================================================= */
function downloadJSONFile(data, filename){
  try{
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){ console.error('export failed', e); }
}
function normalizeImportedProduct(p, idx){
  p = p || {};
  return {
    id: (typeof p.id === 'number' && isFinite(p.id)) ? p.id : (idx+1),
    name: p.name || '',
    cat: p.cat || CATEGORY_OPTIONS[0],
    brand: p.brand || '',
    price: Number(p.price)||0,
    oldPrice: (p.oldPrice!==undefined && p.oldPrice!==null && p.oldPrice!=='') ? Number(p.oldPrice) : null,
    stock: Number.isFinite(Number(p.stock)) ? Number(p.stock) : 0,
    rating: Number(p.rating)||0,
    reviews: Number(p.reviews)||0,
    badges: Array.isArray(p.badges) ? p.badges : [],
    illustration: p.illustration || 'none',
    photo: p.photo || null,
    photos: Array.isArray(p.photos) ? p.photos : [],
    grad: p.grad || GRAD_OPTIONS[0],
    dark: !!p.dark,
    desc: p.desc || '',
    specs: Array.isArray(p.specs) ? p.specs : []
  };
}
function exportProductsJSON(){
  if(!isAdmin()) return;
  downloadJSONFile(products, 'products.json');
  showToast(t('productsExportedToast'));
}
function importProductsJSON(inputEl){
  if(!isAdmin()){ inputEl.value=''; return; }
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      const list = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.products) ? parsed.products : null);
      if(!list) throw new Error('bad format');
      const normalized = list.map((p,i)=>normalizeImportedProduct(p,i));
      products = normalized;
      nextId = normalized.length ? Math.max(...normalized.map(p=>p.id))+1 : 1;
      saveCatalog();
      showToast(t('productsImportedToast'));
      renderApp();
    }catch(err){
      showToast(t('importErrorToast'));
    }
  };
  reader.onerror = () => showToast(t('importErrorToast'));
  reader.readAsText(file);
}
function exportFullConfigJSON(){
  if(!isAdmin()) return;
  const data = {
    type: 'mini-shop-config',
    version: 1,
    exportedAt: new Date().toISOString(),
    products, nextId,
    categories: CATEGORY_OPTIONS,
    banners, nextBannerId,
    settings
  };
  downloadJSONFile(data, 'mini-shop-config.json');
  showToast(t('configExportedToast'));
}
function importFullConfigJSON(inputEl){
  if(!isAdmin()){ inputEl.value=''; return; }
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('bad format');
      const list = Array.isArray(parsed.products) ? parsed.products : null;
      if(!list) throw new Error('bad format');
      const normalized = list.map((p,i)=>normalizeImportedProduct(p,i));
      products = normalized;
      nextId = normalized.length ? Math.max(...normalized.map(p=>p.id))+1 : 1;
      if(Array.isArray(parsed.banners)){
        banners = parsed.banners.map((s,i)=>({ id: (typeof s.id==='number' && isFinite(s.id)) ? s.id : (i+1), photo: s.photo||null, link: s.link||'' }));
        nextBannerId = (typeof parsed.nextBannerId === 'number') ? parsed.nextBannerId : (banners.length ? Math.max(...banners.map(s=>s.id))+1 : 1);
      }
      if(parsed.settings && typeof parsed.settings === 'object'){
        settings = Object.assign({}, defaultSettings(), settings, parsed.settings);
      }
      saveCatalog();
      saveBanners();
      showToast(t('configImportedToast'));
      renderApp();
    }catch(err){
      showToast(t('importErrorToast'));
    }
  };
  reader.onerror = () => showToast(t('importErrorToast'));
  reader.readAsText(file);
}
